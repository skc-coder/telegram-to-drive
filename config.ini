[telegram]
; Get api_id and api_hash from https://my.telegram.org
api_id = YOUR_API_ID
api_hash = YOUR_API_HASH
phone_number = YOUR_PHONE_NUMBER

[rclone]
; Name of your rclone remote (e.g. gdrive, mydrive)
remote_name = gdrive
; Target folder on Google Drive
remote_folder = Telegram_Downloads
; Bandwidth limit for rclone upload (e.g. 10M, 5M, 0 for unlimited)
max_upload_speed = 0

[settings]
; Temporary directory for downloading before uploading
temp_download_dir = /mnt/storage/telegram_downloads
; Concurrency settings
download_workers = 3
upload_workers = 3
; Storage Disk Guard: Pause downloads if available disk space falls below this threshold in GB
min_free_disk_gb = 5.0
; Max download retries on network error
max_retries = 5
; Download speed limit for Telethon (in KB/s, 0 for unlimited)
max_download_speed_kb = 0
; Allowed file extensions (comma separated, e.g. .mp4,.mkv,.pdf,.zip or empty/all for all media)
allowed_extensions = all

[channels]
; List Telegram channel links or username/IDs below
channel_1 = https://web.telegram.org/k/#-2377806273
channel_2 = https://web.telegram.org/k/#-2434461839
